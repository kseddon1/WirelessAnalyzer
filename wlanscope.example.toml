# wlanscope configuration (TOML). CLI flags override anything set here.
# Usage: sudo python3 -m wlanscope -c wlanscope.toml [--headless]

[sensor]
sensor_id = "pi-lobby"            # appears in every event (default: hostname)
interfaces = ["wlan1mon"]         # several adapters split the channel list between them
channels = "default"              # 1,6,11 | 36-48 | 2g 2g-common 5g 5g-nodfs 6g 6g-psc all default
dwell = 0.25                      # seconds per channel while hopping
# hop = false                     # never retune (keep whatever channel the radio is on)
# split_channels = false          # give every interface the full list
# oui_file = "/usr/share/ieee-data/oui.txt"

[events]
events_file = "/var/log/wlanscope/events.jsonl"
events_max_mb = 50
events_keep = 5
min_severity = "info"             # file/stdout threshold
event_cooldown = 300              # seconds before an identical event may repeat
heartbeat_interval = 60
state_file = "/run/wlanscope/state.json"
state_interval = 10
# Event-Driven Ansible webhook (ansible.eda.webhook). Token may come from $WA_EDA_TOKEN.
# webhook_url = "http://eda.example.net:5000/endpoint"
webhook_min_severity = "warning"
# syslog = "siem.example.net:514"
# syslog_min_severity = "warning"
# api = "0.0.0.0:8088"            # HTTP JSON API for automation / cluster aggregation
# api_token = "change-me"

[thresholds]
idle_after = 30.0                 # s without data => IDLE
active_window = 10.0
client_timeout = 300.0            # s unseen => GONE
ap_timeout = 180.0                # s unseen => AP_LOST
high_util_fps = 200.0             # data frames/s for HIGH-UTIL
high_util_kbps = 5000.0
high_util_share = 0.6             # share of the BSS's data frames
retry_pct = 20.0
low_rssi = -80.0
low_snr = 15.0
low_rate_mbps = 12.0
sticky_rssi = -75.0
high_channel_util_pct = 70.0      # from the AP's BSS Load element
deauth_flood_count = 20           # per BSS in deauth_window seconds
deauth_window = 10.0
client_deauth_count = 5
auth_fail_count = 2
roam_storm_count = 4              # roams/associations in roam_window
roam_window = 60.0
tsf_regression_count = 3          # beacon TSF jumps => SPOOFED_BSSID
karma_ssid_count = 3              # SSIDs one BSSID answers probes for => KARMA
evil_twin_score = 3
learning_period = 15.0            # no AP_NEW/CLIENT_NEW events during startup
noise_floor = -95.0               # used for SNR when the driver reports no noise

# Networks you own. Any BSS advertising the SSID outside policy is scored as
# an evil twin (security mismatch alone is enough for a critical alert).
[[managed_ssid]]
ssid = "CorpWiFi"
security = ["WPA2-Enterprise", "WPA3-Enterprise"]   # substring match on the security label
allowed_ouis = ["70:69:5a", "a0:e0:af"]             # optional: your AP vendors' OUIs
# allowed_bssids = ["70:69:5a:10:"]                 # optional: full MACs or prefixes
# bands = ["2g", "5g"]

[[managed_ssid]]
ssid = "CorpGuest"
security = ["OPEN"]
